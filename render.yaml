services:
  - type: pgsql
    name: school-db
    region: singapore
    plan: free

  - type: web
    name: school-backend
    runtime: python
    plan: free
    buildCommand: uv sync --frozen || pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        value: hmlX9mPQkjDrutKG7whm8RXoeNy8ToXg
      - key: BETTER_AUTH_URL
        sync: false

  - type: web
    name: school-frontend
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: school-backend
          type: web
          property: host
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false